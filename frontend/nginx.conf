# Serves the built React SPA and reverse-proxies API/admin/static traffic to the Django backend
# container over the Docker network — no host port or public URL for the backend is needed at
# all in UAT/production (see docker-compose.backend.prod.yml). Frontend and API share one public
# origin this way, so no CORS is required for real cross-origin requests; Django's CORS/CSRF
# settings should still be set to this same public origin as a defense-in-depth belt-and-braces
# (see .env.backend.production.example).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing — any path not matched below falls through to index.html so
    # react-router-dom can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sensible caching for hashed build assets; index.html itself must never be cached, or a
    # deploy could leave clients running a stale build pointed at an old asset manifest.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        # nginx's own default (1MB) is well under the 10MB onboarding-document limit the app
        # advertises and enforces server-side (backend/onboarding/services.py's
        # MAX_DOCUMENT_BYTES) — without this, any upload between 1MB and 10MB was silently
        # rejected here with a bare nginx 413 before ever reaching Django. Found live during
        # production-stack verification.
        client_max_body_size 10m;
        proxy_pass http://backend:8000/api/;
        include /etc/nginx/proxy-params-backend.conf;
    }

    # Django admin — unused by the app today (no code path grants is_staff), but proxied through
    # for the same reason it's still routed in Django itself: an operator-run `createsuperuser`
    # remains a legitimate emergency-access path, and it's already gated by Django's own auth.
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        include /etc/nginx/proxy-params-backend.conf;
    }

    # Django's own static files (admin CSS/JS) — see backend/config/settings.py's STATIC_URL and
    # DEPLOYMENT.md's static-files note.
    location /static/ {
        proxy_pass http://backend:8000/static/;
        include /etc/nginx/proxy-params-backend.conf;
    }
}
