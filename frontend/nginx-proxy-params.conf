# Shared proxy headers for every location that forwards to the backend container — keeps
# Django's request.get_host(), ALLOWED_HOSTS check, and CSRF origin check seeing the real
# client-facing host/scheme rather than nginx's own internal Docker-network request.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_redirect off;
