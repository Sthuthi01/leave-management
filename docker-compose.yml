services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=leaflow
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-leaflow}
      - POSTGRES_DB=leaflow
    ports:
      # Host port 5433, not 5432 — avoids clashing with a native Postgres install
      # (e.g. Postgres.app) that may already be listening on the default port.
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaflow -d leaflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Local-dev-only fake SMTP server: accepts any email the app sends and shows it in a web
  # inbox instead of delivering it anywhere real. Swap SMTP_HOST/PORT/USER/PASS below to a real
  # provider for staging/production — the app's email code (src/lib/email.ts) doesn't change.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web inbox — open http://localhost:8025
      - "1025:1025" # SMTP port the app sends to
    restart: unless-stopped

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Falls back to an insecure dev default (with a startup warning) if unset —
      # set a real value in a .env file or your shell before deploying anywhere
      # reachable by untrusted clients. See .env.example.
      - SESSION_SECRET=${SESSION_SECRET}
      - DATABASE_URL=postgres://leaflow:${POSTGRES_PASSWORD:-leaflow}@db:5432/leaflow
      # Local-dev-only: populates the demo employees/departments/leave data described in
      # src/lib/mock-data/seed.ts on first startup against an empty database. Never set this in
      # production — see docker-compose.prod.yml, which deliberately leaves it unset.
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-true}
      # Invitation/password-reset emails. Defaults to the Mailpit service above for local dev —
      # see .env.example for how to point this at a real SMTP provider instead. With no
      # SMTP_HOST at all (e.g. Mailpit removed and nothing set), emails are printed to
      # `docker compose logs app` instead of sent.
      - APP_URL=${APP_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM:-Agrileaf <no-reply@agrileaf.in>}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

volumes:
  db-data:
