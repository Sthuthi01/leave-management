name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  # Detects whether this push/PR actually touches backend code, frontend code, or shared
  # infra (deps, Docker, test files, this workflow) — a docs-only change skips the rest of
  # the pipeline entirely, while a change to either side still runs the full check suite
  # (this is one Next.js app with a single typecheck/build, so there's no meaningful way to
  # check "only the backend" in isolation — the split below is about what triggers CI, not
  # about running two independent pipelines).
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      run_checks: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.infra == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/app/api/**'
              - 'src/lib/**'
              - 'drizzle/**'
              - 'src/instrumentation.ts'
              - 'sentry.server.config.ts'
            frontend:
              - 'src/app/**'
              - '!src/app/api/**'
              - 'src/components/**'
              - 'public/**'
            infra:
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'next.config.*'
              - 'Dockerfile'
              - 'docker-compose*.yml'
              - 'tests/**'
              - '.github/workflows/**'

  lint-and-typecheck:
    needs: changes
    if: needs.changes.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  unit-tests:
    needs: changes
    if: needs.changes.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  e2e-tests:
    needs: changes
    if: needs.changes.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # docker-compose.yml (the local-dev stack, not docker-compose.prod.yml) runs with safe
      # insecure-by-default values when no .env is present — see .env.example — so CI needs no
      # secrets to bring it up. This is the same stack and the same `npx playwright test`
      # command documented in README.md's Testing section.
      - name: Start app stack
        run: docker compose up -d --build

      - name: Wait for app to be healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$(docker compose ps -q app)" 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "app is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::app did not become healthy in time"
          docker compose logs app
          exit 1

      - name: Run E2E suite
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Dump app logs on failure
        if: failure()
        run: docker compose logs app

      - name: Tear down app stack
        if: always()
        run: docker compose down -v

  build-and-push:
    needs: [lint-and-typecheck, unit-tests, e2e-tests]
    # Only push a real image on main/tags — pull_request builds are checked (via the jobs
    # above) but never published, so a PR from a fork can't publish to the registry.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
