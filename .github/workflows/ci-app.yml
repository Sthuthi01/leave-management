name: CI (application)

# Replacement for the old `ci.yml`, which only builds/tests the original Next.js app (src/,
# drizzle/, root package.json) — it has zero awareness of backend/ or frontend/. This workflow
# covers the current application (React + TypeScript + Ant Design frontend, Django + DRF backend,
# PostgreSQL). ci.yml is left untouched; see PRE_CLEANUP_REVIEW.md / PRE_CLEANUP_DELETE_PLAN.md
# for the plan to retire it once this workflow has proven itself.
#
# Every command below is one already established and directly verified to work in this repo —
# nothing here is invented: frontend commands come straight from frontend/package.json's own
# scripts; backend commands are the same `manage.py check`/`manage.py test` run throughout this
# project's own verification passes.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      run_checks: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.infra == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'docker-compose.backend.yml'
              - 'docker-compose.backend.prod.yml'
              - 'backend/Dockerfile'
              - 'frontend/Dockerfile'
              - '.github/workflows/ci-app.yml'

  frontend:
    needs: changes
    if: needs.changes.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: TypeScript check
        run: npx tsc -b
      - name: Build
        run: npx vite build
      - name: Tests
        run: npx vitest run
      # frontend/package.json has no `lint` script configured at this time — nothing to run here.
      # Add a lint step once one exists; do not invent a command that isn't defined in the project.

  backend:
    needs: changes
    if: needs.changes.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test -d ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_DEBUG: "true"
      DJANGO_DATABASE_URL: postgres://ci_test:ci_test@localhost:5432/ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Django test suite
        run: python manage.py test

  docker-config:
    needs: changes
    if: needs.changes.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.backend.yml
        run: docker compose -f docker-compose.backend.yml config --quiet
